# Scene C — expected level 1. Dán số tài khoản mới, mục đích Khác.
# The live card is the model-cost line plus a behaviour line, still one non-blocking line.
appId: com.hainamtran.saobank
---
- launchApp
- tapOn: ".*Trương Gia Thịnh.*"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "paste-account"
- tapOn:
    id: "new-account-go"
- tapOn: "5.000.000"
- tapOn: "Nội dung chuyển khoản"
- inputText: "vay bạn"
- hideKeyboard:
    optional: true
- tapOn: "Xác nhận giao dịch"
- tapOn: "Khác"
- tapOn:
    id: "confirm-transfer"
- assertVisible: ".*Điểm mô hình vượt ngưỡng theo số tiền của lệnh này.*"
- assertNotVisible: "Tạm dừng để xác minh"
