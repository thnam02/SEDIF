# Scene D — Hoàng Văn Tâm. device.state active_capture, giả lập demo có gắn nhãn. Mức 2.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Hoàng Văn Tâm.*"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZCAP400000000001"
- tapOn:
    id: "new-account-go"
- scrollUntilVisible:
    element: "Khác"
    direction: DOWN
- tapOn: "Khác"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- scrollUntilVisible:
    element: "Giả lập demo: màn hình đang bị ghi"
    direction: DOWN
- tapOn:
    id: "dev-active-capture"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Tạm dừng để xác minh"
- assertVisible: ".*ghi hoặc chiếu.*"
