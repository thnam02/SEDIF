# Scene A — Lê Kim Trân. Cuộc gọi và quét QR tới cửa hàng mới. Mức 1.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Lê Kim Trân.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "scan-shop-qr"
- tapOn:
    id: "amount"
- eraseText: 12
- inputText: "60000"
- tapOn:
    id: "amount-dismiss"
- scrollUntilVisible:
    element:
      id: "purpose-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "purpose-open"
- tapOn: "Mua hàng, dịch vụ"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- scrollUntilVisible:
    element:
      id: "level-1-continue"
    direction: DOWN
- assertVisible: "Tiếp tục chuyển"
- assertVisible: "Huỷ"
- assertVisible: ".*Bạn đang trong cuộc gọi và chuyển tiền cho người nhận mới.*"
- assertNotVisible: "Chuyển tiền thành công"
- tapOn:
    id: "level-1-continue"
- assertVisible: "Chuyển tiền thành công"
- assertVisible: ".*Bạn đang trong cuộc gọi và chuyển tiền cho người nhận mới.*"
- assertNotVisible: "Tạm dừng để xác minh"
- assertNotVisible: "Giao dịch đang được ngân hàng xem xét"
