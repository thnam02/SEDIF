# Scene B — expected level 1. Cuộc gọi, người nhận đã lưu. Một dòng không chặn.
appId: com.hainamtran.saobank
---
- launchApp
- tapOn: ".*Hoàng Văn Tâm.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-relative"
- tapOn: "Chuyển tiền"
- tapOn: ".*Lê Lan Hà.*"
- tapOn: "Nội dung chuyển khoản"
- inputText: "học phí"
- hideKeyboard:
    optional: true
- tapOn: "Xác nhận giao dịch"
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Đang trong cuộc gọi"
- assertVisible: ".*nghỉ lâu giữa các thao tác.*"
- assertNotVisible: "Tạm dừng để xác minh"
