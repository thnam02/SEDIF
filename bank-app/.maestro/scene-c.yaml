# Scene C — chỉ Trương Gia Thịnh có 10 phiên nền. Cuộc gọi, người nhận gõ mới. Mức 2.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Trương Gia Thịnh.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZGUIDE4000000001"
- tapOn:
    id: "new-account-go"
- scrollUntilVisible:
    element: "Gia đình, bạn bè"
    direction: DOWN
- tapOn: "Gia đình, bạn bè"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- scrollUntilVisible:
    element: "Phiên có hướng dẫn (demo)"
    direction: DOWN
- tapOn:
    id: "dev-guided"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Tạm dừng để xác minh"
- assertVisible: ".*ở ngoài app.*"
- assertVisible: ".*cuộc gọi.*"
- assertVisible: ".*người nhận.*"
