# Scene E — Hoàng Văn Tâm. Người nhận nằm trong danh sách mule demo, có gắn nhãn. Mức 3.
appId: com.hainamtran.saobank
---
- launchApp:
    clearKeychain: true
- tapOn: ".*Hoàng Văn Tâm.*"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZMULEDEMO0000001"
- tapOn:
    id: "new-account-go"
- scrollUntilVisible:
    element:
      id: "purpose-open"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "purpose-open"
- tapOn: "Khác"
- scrollUntilVisible:
    element:
      id: "continue-transfer"
    direction: DOWN
- tapOn:
    id: "continue-transfer"
- scrollUntilVisible:
    element:
      id: "confirm-transfer"
    direction: DOWN
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Giao dịch đang được ngân hàng xem xét"
- assertVisible: "Giữ 24 giờ là chính sách giả của ngân hàng trong bản demo."
- assertNotVisible: "Tạm dừng để xác minh"
