# Scene D — call, savings liquidation, new payee. Live card stayed level 1
# (model cost), so the three-button screen is not shown.
appId: com.hainamtran.saobank
---
- launchApp
- tapOn: ".*Huỳnh Thị Mận.*"
- repeat:
    times: 7
    commands:
      - tapOn: "BVC BANK"
- tapOn:
    id: "call-stranger"
- tapOn: "Tiết kiệm"
- tapOn: "Tất toán trước hạn"
- tapOn: "Tất toán trước hạn"
- tapOn: "Về trang chủ"
- tapOn: ".*Cá nhân.*"
- tapOn: "Hạn mức chuyển tiền"
- tapOn:
    id: "limit-txn"
- eraseText: 12
- inputText: "200000000"
- hideKeyboard:
    optional: true
- tapOn: "Cập nhật"
- extendedWaitUntil:
    visible: "Đã cập nhật"
    timeout: 10000
- tapOn: ".*Trang chủ.*"
- tapOn: ".*Trang chủ.*"
- tapOn: "Chuyển tiền"
- tapOn:
    id: "new-account-open"
- tapOn:
    id: "new-account"
- inputText: "ZLAN120000000001"
- hideKeyboard:
    optional: true
- tapOn:
    id: "new-account-go"
- tapOn:
    id: "amount"
- eraseText: 12
- inputText: "120000000"
- hideKeyboard:
    optional: true
- tapOn: "Xác nhận giao dịch"
- scrollUntilVisible:
    element: "Mua hàng, dịch vụ"
    direction: DOWN
- tapOn: "Mua hàng, dịch vụ"
- tapOn:
    id: "confirm-transfer"
- assertVisible: "Đang trong cuộc gọi"
- assertVisible: ".*Điểm mô hình vượt ngưỡng theo số tiền của lệnh này.*"
- assertNotVisible: "Tạm dừng để xác minh"
