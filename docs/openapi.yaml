openapi: 3.1.0
info:
  title: FIDES
  version: 2.4.0
  summary: Engine chấm điểm và lõi ngân hàng giả.
  description: >
    App không gửi ts. Bank-core đóng dấu theo đồng hồ demo: bắt đầu
    2026-09-20T00:00:00+07:00, chạy nhanh gấp 60, phủ 9 ngày cuối đến trước
    2026-09-29. Engine chỉ nhận HMAC-SHA256, khoá lấy từ biến môi trường
    FIDES_HMAC_KEY. Ví dụ giả công an và người nhà hướng dẫn minh họa hợp đồng,
    không phải điểm của một phiên đã chấm. Bản 2.4.0 khai báo Signal, các trường
    chấm mới trên /decide, evidence_card và POST /decisions/{id}/choice.
    Bank-core trả level số, rules_fired, evidence_card và intervention.
    POST /decisions/{id}/choice ghi response_ms và áp dụng pause, cancel, continue.
servers:
  - url: http://localhost:8081
    description: FIDES Engine
  - url: http://localhost:8082
    description: Bank core giả
tags:
  - name: FIDES Engine
    description: Nhận sự kiện, chấm lệnh chuyển, lưu quyết định. Xác thực bằng API key.
  - name: Bank core
    description: Sổ tài khoản và lệnh tiền. Sản phẩm chỉ ghi sự kiện, không gọi /decide.
paths:
  /events:
    post:
      tags: [FIDES Engine]
      operationId: ingestEvent
      security:
        - apiKey: []
      summary: Ghi một sự kiện, idempotent theo event_id
      description: >
        Cùng event_id gửi lại trả bản đã lưu. ts là dấu của đồng hồ demo do bank-core ghi,
        không phải đồng hồ app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Event"
            examples:
              gia_cong_an:
                summary: Giao dịch trong cuộc gọi giả cơ quan nhà nước
                value:
                  event_id: evt-police-001
                  type: txn
                  ts: "2026-09-21T10:15:00+07:00"
                  account_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  counterparty_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  amount: 50000000
                  tx_type: transfer
              nguoi_nha_huong_dan:
                summary: Học phí tới người nhận đã từng chuyển
                value:
                  event_id: evt-guided-001
                  type: txn
                  ts: "2026-09-22T19:40:00+07:00"
                  account_hash: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                  counterparty_hash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                  amount: 8000000
                  tx_type: school_fee
      responses:
        "200":
          description: event_id đã tồn tại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReceipt"
              examples:
                gia_cong_an:
                  value: {event_id: evt-police-001, stored: false}
                nguoi_nha_huong_dan:
                  value: {event_id: evt-guided-001, stored: false}
        "201":
          description: Ghi mới.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventReceipt"
              examples:
                gia_cong_an:
                  value: {event_id: evt-police-001, stored: true}
                nguoi_nha_huong_dan:
                  value: {event_id: evt-guided-001, stored: true}
  /decide:
    post:
      tags: [FIDES Engine]
      operationId: decide
      security:
        - apiKey: []
      summary: Chấm một lệnh chuyển
      description: >
        device có thể vắng. Mọi trường trong device đều được null. Thiếu device thì profile
        hiệu lực hạ xuống basic. ts do bank-core đóng từ đồng hồ demo.
        task_type và behaviour_features được engine đọc để chấm tầng thao tác.
        experiment chọn ghi baseline ngay (thí nghiệm) hay sau 24 giờ.
        behaviour_features chỉ là số tổng hợp trên máy, không có mốc thời gian thô.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
            examples:
              gia_cong_an:
                summary: Dán số tài khoản khi đang nghe máy
                value:
                  decision_id: dec-police-001
                  profile: advanced
                  sender_hash: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                  payee_hash: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                  amount: 50000000
                  ts: "2026-09-21T10:15:00+07:00"
                  task_type: new_pasted
                  call:
                    state: active
                    observability: supported_observed
                    transport: cellular
                  behaviour_features:
                    median_gap_ms: 420
                    p90_gap_ms: 1800
                    burst_count: 3
                    pause_to_action_ratio: 0.15
                    review_dwell_ms: 900
                    edit_count: 0
                    backtrack_count: 1
                    screen_revisit_count: 2
                    background_count: 4
                    background_total_ms: 12000
                    session_duration_ms: 640000
                  transfer_purpose: authority_request
                  device:
                    in_call: true
                    call_seconds_since_open: 640
                    call_ended_in_session: false
                    call_direction: null
                    acct_input: pasted
                    app_switches: 7
                    state: none
                    integrity_verdict_at: null
                  recent_funds_events:
                    - type: savings_liquidation
                      at: "2026-09-21T09:40:00+07:00"
                      channel: app
                  experiment:
                    participant_id: p-001
                    condition: control
                    session_index: 1
              nguoi_nha_huong_dan:
                summary: Người nhận đã quen, tự gõ số
                value:
                  decision_id: dec-guided-001
                  profile: advanced
                  sender_hash: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
                  payee_hash: dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
                  amount: 8000000
                  ts: "2026-09-22T19:40:00+07:00"
                  task_type: saved_payee
                  call:
                    state: active
                    observability: supported_observed
                    transport: voip
                  behaviour_features:
                    median_gap_ms: 800
                    p90_gap_ms: 2200
                    burst_count: 0
                    pause_to_action_ratio: 0.4
                    review_dwell_ms: 4000
                    edit_count: 1
                    backtrack_count: 0
                    screen_revisit_count: 0
                    background_count: 0
                    background_total_ms: 0
                    session_duration_ms: 180000
                  transfer_purpose: family_friends
                  device:
                    in_call: true
                    call_seconds_since_open: 180
                    call_ended_in_session: false
                    call_direction: inbound
                    acct_input: typed
                    app_switches: 1
                    state: none
                    integrity_verdict_at: null
      responses:
        "200":
          description: Quyết định
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideResponse"
              examples:
                gia_cong_an:
                  summary: High vì cuộc gọi, dán số và người nhận mới
                  value:
                    decision_id: dec-police-001
                    level: 3
                    rules_fired: [in_call, acct_pasted, new_payee]
                    evidence_card:
                      signals:
                        - signal_id: call.state
                          status: present
                          tier: suspicious
                          confidence: 0.9
                          source: sdk
                          observed_at: "2026-09-21T10:15:00+07:00"
                          freshness_s: 2
                      reasons_vi:
                        - "Cuộc gọi đang mở trong phiên này."
                        - "Số tài khoản được dán vào ô chuyển tiền."
                        - "Chưa từng chuyển tới người nhận này."
                      baseline_quality: medium
                      episode_id: ep-police-001
                    intervention: security_workflow
                    actions: [hangup_required, recovery_window]
                    p_fraud: 0.84
                    group_scores: {call: 1, entry: 1, payee: 1, mobilization: 0}
                    families_hit: [call, entry, payee]
                    reasons:
                      - {code: in_call, text: "Cuộc gọi đang mở trong phiên này."}
                      - {code: acct_pasted, text: "Số tài khoản được dán vào ô chuyển tiền."}
                      - {code: new_payee, text: "Chưa từng chuyển tới người nhận này."}
                    missing_signals: []
                    profile: advanced
                    model_version: model-v2.0
                    hold_until: "2026-09-22T10:15:00+07:00"
                    countdown_until: null
                nguoi_nha_huong_dan:
                  summary: Banner vì chỉ có cuộc gọi, người nhận đã từng nhận tiền
                  value:
                    decision_id: dec-guided-001
                    level: 1
                    rules_fired: [in_call]
                    evidence_card:
                      signals: []
                      reasons_vi:
                        - "Cuộc gọi đang mở trong phiên này."
                      baseline_quality: high
                      episode_id: ep-guided-001
                    intervention: banner
                    actions: [g1_banner]
                    p_fraud: 0.01
                    group_scores: {call: 1, entry: 0, payee: 0, mobilization: 0}
                    families_hit: [call]
                    reasons:
                      - {code: in_call, text: "Cuộc gọi đang mở trong phiên này."}
                    missing_signals: []
                    profile: advanced
                    model_version: model-v2.0
                    hold_until: null
                    countdown_until: null
  /respond:
    post:
      deprecated: true
      tags: [FIDES Engine]
      operationId: respond
      security:
        - apiKey: []
      summary: Cập nhật quyết định sau câu trả lời
      description: >
        Deprecated. Sẽ bỏ sau policy v2.4. Lựa chọn mới là POST /decisions/{id}/choice.
        Không bao giờ hạ level. authority hoặc bank nâng lên high.
        relative khi khách có giám hộ đặt gate guardian_confirm_requested và giữ level.
        relative khi không có giám hộ đặt gate short_wait và giữ level.
        friend, seller, nobody, other giữ level.
        hung_up khi level là high bắt đầu countdown 10 phút và không huỷ tiền.
        Cuộc gọi mới reset countdown. proceed sau countdown thì funds_status released.
        cancel bất cứ lúc nào thì cancelled. guardian_confirm nhả tiền sớm.
        hold_until của medium là 30 phút, của high là 24 giờ. short_wait là 2 phút.
        Các mốc này là GIẢ ĐỊNH trong fides-sim/config.yaml.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RespondRequest"
            examples:
              gia_cong_an:
                summary: Khách cúp máy ở mức high
                value:
                  decision_id: dec-police-001
                  who_guides: authority
                  hung_up: true
              nguoi_nha_huong_dan:
                summary: Khách nói người nhà hướng dẫn, không có giám hộ
                value:
                  decision_id: dec-guided-001
                  who_guides: relative
      responses:
        "200":
          description: Mức không bị hạ, và mốc giữ tiền
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespondResponse"
              examples:
                gia_cong_an:
                  summary: Cúp máy lúc 21/9 10:20. Countdown 10 phút, tiền vẫn held 24 giờ
                  value:
                    decision_id: dec-police-001
                    level: high
                    funds_status: held
                    gate: none
                    hold_until: "2026-09-22T10:15:00+07:00"
                    countdown_until: "2026-09-21T10:30:00+07:00"
                nguoi_nha_huong_dan:
                  summary: Banner không đổi, chờ ngắn 2 phút
                  value:
                    decision_id: dec-guided-001
                    level: banner
                    funds_status: released
                    gate: short_wait
                    hold_until: null
                    countdown_until: null
        "404":
          description: Không có decision_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /decisions:
    get:
      tags: [FIDES Engine]
      operationId: listDecisions
      security:
        - apiKey: []
      summary: Danh sách quyết định
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: cursor
          in: query
          schema: {type: string}
          description: Mốc trang trước, dạng ts|decision_id.
        - name: from_ts
          in: query
          schema: {type: string, format: date-time}
        - name: to_ts
          in: query
          schema: {type: string, format: date-time}
          description: Cận trên, không tính mốc này.
        - name: level
          in: query
          schema: {type: string, enum: [none, info, banner, medium, high]}
      responses:
        "200":
          description: Các quyết định đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [decisions, next_cursor]
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/DecisionSummary"
                  next_cursor:
                    anyOf:
                      - type: string
                      - type: "null"
  /decisions/{id}:
    get:
      tags: [FIDES Engine]
      operationId: getDecision
      security:
        - apiKey: []
      summary: Một quyết định
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quyết định
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecideResponse"
        "404":
          description: Không có quyết định
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /decisions/{id}/choice:
    post:
      tags: [FIDES Engine]
      operationId: recordUserChoice
      security:
        - apiKey: []
      summary: Ghi lựa chọn của khách sau can thiệp
      description: >
        pause giữ lệnh pending_draft và tiền held. cancel hoàn tiền. continue giải phóng tiền.
        Engine chỉ ghi response_ms, không đổi level. Bank-core chuyển tiếp rồi áp dụng lên lệnh.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: decision_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserChoiceRequest"
            examples:
              tiep_tuc:
                summary: Khách bấm tiếp tục sau 12 giây
                value:
                  choice: continue
                  response_ms: 12000
      responses:
        "200":
          description: Đã ghi lựa chọn cho nghiên cứu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserChoiceReceipt"
              examples:
                tiep_tuc:
                  value:
                    decision_id: dec-police-001
                    choice: continue
                    logged: true
        "404":
          description: Không có quyết định
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}:
    get:
      tags: [Bank core]
      operationId: getAccount
      summary: Hồ sơ một tài khoản
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Tài khoản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          description: Không có tài khoản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/history:
    get:
      tags: [Bank core]
      operationId: getAccountHistory
      summary: Giao dịch của tài khoản
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: before
          in: query
          required: false
          description: Mốc cắt của sổ, không phải đồng hồ app.
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Lịch sử
          content:
            application/json:
              schema:
                type: object
                required: [account_id, entries]
                properties:
                  account_id:
                    type: string
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/HistoryEntry"
        "404":
          description: Không có tài khoản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/beneficiaries:
    get:
      tags: [Bank core]
      operationId: listBeneficiaries
      summary: Người thụ hưởng đã lưu của một tài khoản
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [account_id, beneficiaries]
                properties:
                  account_id:
                    type: string
                  beneficiaries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Beneficiary"
        "404":
          description: Không có tài khoản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /accounts/{id}/savings:
    get:
      tags: [Bank core]
      operationId: listSavings
      summary: Sổ tiết kiệm cùng khách hàng với tài khoản thanh toán
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Các sổ đang mở
          content:
            application/json:
              schema:
                type: object
                required: [account_id, books]
                properties:
                  account_id:
                    type: string
                  books:
                    type: array
                    items:
                      $ref: "#/components/schemas/SavingsBook"
        "404":
          description: Không có tài khoản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /beneficiaries/{id}:
    get:
      tags: [Bank core]
      operationId: getBeneficiary
      summary: Người thụ hưởng đã lưu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Người thụ hưởng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
              examples:
                gia_cong_an:
                  summary: Chưa từng chuyển
                  value:
                    id: BE-police-001
                    account_id: A0099001
                    holder_name: CONG AN TINH
                    saved_at: "2026-09-21T10:14:20+07:00"
                    times_paid: 0
                nguoi_nha_huong_dan:
                  summary: Đã chuyển vài lần
                  value:
                    id: BE-guided-001
                    account_id: A0088001
                    holder_name: TRUONG DAI HOC
                    saved_at: "2026-08-02T09:00:00+07:00"
                    times_paid: 4
        "404":
          description: Không có người thụ hưởng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /transfer:
    post:
      tags: [Bank core]
      operationId: createTransfer
      summary: Tạo lệnh chuyển
      description: >
        App không gửi ts. Bank-core đóng dấu đồng hồ demo, băm số tài khoản bằng HMAC-SHA256
        rồi gọi POST /decide. none, info và banner cho đi.
        Người nhận simo_listed được ít nhất banner, trừ khi người gửi đã chuyển
        cho người đó từ 3 lần trở lên, lần đầu cách lúc liệt kê ít nhất 60 ngày, và không có họ thao túng:
        lúc đó chỉ là ghi chú info.
        medium giữ 30 phút. high giữ 24 giờ và chặn cho đến khi cúp máy.
        Header Idempotency-Key trả lại đúng lệnh đã tạo, không ghi nợ lần hai.
        /decide hết 300 ms hoặc lỗi thì chuyển bình thường và ghi log engine_unavailable.
        Từ 50 triệu tới người nhận mới thì vẫn hiện banner. Thiếu device thì engine dùng profile basic.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
            examples:
              gia_cong_an:
                value:
                  from_account: A0010001
                  to_account: A0099001
                  amount: 50000000
                  purpose_text: nộp phí
                  device:
                    in_call: true
                    call_seconds_since_open: 640
                    call_ended_in_session: false
                    call_direction: null
                    acct_input: pasted
                    app_switches: 7
              nguoi_nha_huong_dan:
                value:
                  from_account: A0010002
                  to_account: A0088001
                  amount: 8000000
                  purpose_text: học phí
                  device:
                    in_call: true
                    call_seconds_since_open: 180
                    call_ended_in_session: false
                    call_direction: inbound
                    acct_input: typed
                    app_switches: 1
      responses:
        "200":
          description: Lệnh đã được chấm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
              examples:
                gia_cong_an:
                  value:
                    transfer_id: X-police-001
                    status: blocked_pending_hangup
                    funds_status: held
                    hold_until: "2026-09-22T10:15:00+07:00"
                    decision:
                      level: high
                      actions: [hangup_required, recovery_window]
                      reasons:
                        - {code: in_call, text: "Cuộc gọi đang mở trong phiên này."}
                        - {code: acct_pasted, text: "Số tài khoản được dán vào ô chuyển tiền."}
                        - {code: new_payee, text: "Chưa từng chuyển tới người nhận này."}
                nguoi_nha_huong_dan:
                  value:
                    transfer_id: X-guided-001
                    status: done
                    funds_status: released
                    hold_until: null
                    decision:
                      level: banner
                      actions: [g1_banner]
                      reasons:
                        - {code: in_call, text: "Cuộc gọi đang mở trong phiên này."}
  /experiment/sessions:
    post:
      tags: [Bank core]
      operationId: storeExperimentSession
      summary: Lưu một phiên thí nghiệm
      description: >
        Chỉ khi khách đã đồng ý. raw_events là loại sự kiện và mốc monotonic,
        không có ký tự đã gõ, số tài khoản, số tiền hay toạ độ. Bank-core băm
        HMAC mọi mã tài khoản trước khi ghi. raw_events không được gửi vào /decide.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentSessionUpload"
      responses:
        "200":
          description: Đã ghi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentSessionReceipt"
  /transfer/{id}/respond:
    post:
      tags: [Bank core]
      operationId: respondTransfer
      summary: Trả lời trên một lệnh chuyển
      description: >
        Không nhận decision_id. Lệnh nằm ở path. Cùng luật với POST /respond của engine.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: transfer_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRespondRequest"
            examples:
              gia_cong_an:
                summary: Cúp máy, bắt đầu countdown, chưa huỷ
                value:
                  who_guides: authority
                  hung_up: true
              nguoi_nha_huong_dan:
                summary: Người nhà hướng dẫn
                value:
                  who_guides: relative
      responses:
        "200":
          description: Lệnh sau khi trả lời
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferRespondResponse"
              examples:
                gia_cong_an:
                  summary: Cúp máy lúc 21/9 10:20. Countdown hết 21/9 10:30
                  value:
                    transfer_id: X-police-001
                    status: held
                    level: high
                    funds_status: held
                    gate: none
                    hold_until: "2026-09-22T10:15:00+07:00"
                    countdown_until: "2026-09-21T10:30:00+07:00"
                nguoi_nha_huong_dan:
                  value:
                    transfer_id: X-guided-001
                    status: done
                    level: banner
                    funds_status: released
                    gate: short_wait
                    hold_until: null
                    countdown_until: null
        "404":
          description: Không có lệnh
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /savings/liquidate:
    post:
      tags: [Bank core]
      operationId: liquidateSavings
      summary: Rút sổ tiết kiệm
      description: Ghi event type product, product_type savings_liquidation. Không gọi /decide. Trả done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Đã ghi sự kiện
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAck"
  /loan:
    post:
      tags: [Bank core]
      operationId: disburseLoan
      summary: Giải ngân khoản vay
      description: Ghi event type product, product_type quick_loan_disbursement. Không gọi /decide. Trả done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Đã ghi sự kiện
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAck"
  /card/cash-advance:
    post:
      tags: [Bank core]
      operationId: cashAdvance
      summary: Ứng tiền mặt từ thẻ
      description: Ghi event type product, product_type credit_card_cash_advance. Không gọi /decide. Trả done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: Đã ghi sự kiện
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAck"
  /limit:
    post:
      tags: [Bank core]
      operationId: changeLimit
      summary: Đổi hạn mức
      description: Ghi event type account_change, change_type limit_raise. Không gọi /decide. Trả done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitRequest"
      responses:
        "200":
          description: Đã ghi sự kiện
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductAck"
  /config:
    get:
      tags: [Bank core]
      operationId: bankConfig
      summary: Ngưỡng hỏi mục đích chuyển khoản
      responses:
        "200":
          description: Số tiền vượt ngưỡng này thì app hỏi mục đích, kể cả người nhận đã lưu
          content:
            application/json:
              schema:
                type: object
                required: [purpose_amount_vnd]
                properties:
                  purpose_amount_vnd:
                    type: integer
                    minimum: 0
  /guardian:
    post:
      tags: [Bank core]
      operationId: registerGuardian
      summary: Đăng ký giám hộ
      description: App không gửi ts. Bank-core đóng dấu đồng hồ demo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuardianRequest"
      responses:
        "200":
          description: Đã ghi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianResponse"
  /guardian/requests:
    get:
      tags: [Bank core]
      operationId: listGuardianRequests
      summary: Các yêu cầu đang chờ giám hộ xác nhận
      responses:
        "200":
          description: Danh sách
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: "#/components/schemas/GuardianRequestItem"
  /guardian/requests/{id}/confirm:
    post:
      tags: [Bank core]
      operationId: confirmGuardianRequest
      summary: Giám hộ xác nhận một yêu cầu
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Đã xác nhận. Tiền của lệnh Medium được released.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianConfirmResponse"
        "404":
          description: Không có yêu cầu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Khoá gọi FIDES Engine. Bank-core không dùng scheme này.
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Mã tài khoản trong sổ ngân hàng giả.
  schemas:
    Hash:
      type: string
      pattern: "^[0-9a-f]{64}$"
      description: HMAC-SHA256 hex. Khoá là biến môi trường FIDES_HMAC_KEY. Không gửi số tài khoản thô cho engine.
    NullableBool:
      anyOf:
        - type: boolean
        - type: "null"
    NullableInt:
      anyOf:
        - type: integer
        - type: "null"
    Device:
      type: object
      description: Có thể bỏ cả khối. Từng trường đều nhận null. call_direction null là Android.
      properties:
        in_call:
          $ref: "#/components/schemas/NullableBool"
        call_seconds_since_open:
          $ref: "#/components/schemas/NullableInt"
        call_ended_in_session:
          $ref: "#/components/schemas/NullableBool"
        call_direction:
          anyOf:
            - type: string
              enum: [inbound, outbound]
            - type: "null"
        acct_input:
          anyOf:
            - type: string
              enum: [typed, typed_chunked, pasted, chosen]
            - type: "null"
          description: Đúng acct_input_share trong fides-sim/config.yaml.
        app_switches:
          $ref: "#/components/schemas/NullableInt"
    Signal:
      type: object
      additionalProperties: false
      description: Tín hiệu dùng lại trong thẻ bằng chứng. Chưa có bộ tín hiệu chạy thật.
      required: [signal_id, status, tier, confidence, source, observed_at, freshness_s]
      properties:
        signal_id:
          type: string
        status:
          type: string
          enum: [present, absent, unknown]
        tier:
          type: string
          enum: [contextual, suspicious, verified]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        source:
          type: string
          enum: [sdk, core_banking, simo, model, device_attestation, user_answer]
        observed_at:
          type: string
          format: date-time
          description: RFC3339.
        freshness_s:
          type: integer
          minimum: 0
          description: Số giây từ observed_at tới lúc chấm.
    TaskType:
      type: string
      enum: [saved_payee, new_typed, new_pasted, qr]
      description: Cách khách chọn người nhận. Khoá baseline thao tác cùng loại.
    EntryDetail:
      type: string
      enum: [paste, image_capture, image_upload]
      description: >
        Cách đưa số người nhận vào ô, khi task_type là new_pasted.
        Không tham gia chấm điểm. Chỉ hiện trên thẻ bằng chứng.
    CallContext:
      type: object
      additionalProperties: false
      description: Trạng thái cuộc gọi lúc chấm. Không ghi ai gọi hay ứng dụng nào.
      required: [state, observability, transport]
      properties:
        state:
          type: string
          enum: [active, ended_in_session, none, unknown]
        observability:
          type: string
          enum: [supported_observed, supported_not_observed, unavailable]
        transport:
          type: string
          enum: [cellular, voip, unknown]
    BehaviourFeatures:
      type: object
      additionalProperties: false
      description: >
        Số tổng hợp tính trên máy. Không gửi mốc thời gian thô.
        Engine dùng các số này để chấm tầng thao tác.
      required:
        - median_gap_ms
        - p90_gap_ms
        - burst_count
        - pause_to_action_ratio
        - review_dwell_ms
        - edit_count
        - backtrack_count
        - screen_revisit_count
        - background_count
        - background_total_ms
        - session_duration_ms
      properties:
        median_gap_ms:
          type: number
          minimum: 0
        p90_gap_ms:
          type: number
          minimum: 0
        burst_count:
          type: integer
          minimum: 0
        pause_to_action_ratio:
          type: number
          minimum: 0
        review_dwell_ms:
          type: integer
          minimum: 0
        edit_count:
          type: integer
          minimum: 0
        backtrack_count:
          type: integer
          minimum: 0
        screen_revisit_count:
          type: integer
          minimum: 0
        background_count:
          type: integer
          minimum: 0
        background_total_ms:
          type: integer
          minimum: 0
        session_duration_ms:
          type: integer
          minimum: 0
    TransferPurpose:
      type: string
      enum:
        - authority_request
        - fee_to_receive
        - investment
        - refund_request
        - purchase
        - family_friends
        - debt_salary
        - other
        - not_asked
      description: Mục đích khách chọn, hoặc not_asked khi app chưa hỏi. Engine đọc.
    DeviceIntegrity:
      type: object
      description: >
        Toàn vẹn thiết bị gửi kèm khối device trên /decide.
        additionalProperties không khoá để allOf với Device vẫn nhận in_call và acct_input.
        Engine đọc state. integrity_verdict_at vẫn chưa đọc.
      properties:
        state:
          type: string
          enum: [capability_detected, active_capture, verified_compromise, unknown, none]
        integrity_verdict_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: RFC3339. Thời điểm phán quyết toàn vẹn. null khi chưa có.
    RecentFundsEvent:
      type: object
      additionalProperties: false
      description: Sự kiện tiền trong 72 giờ từ sổ của bank-core. App không gửi. Engine đọc.
      required: [type, at, channel]
      properties:
        type:
          type: string
        at:
          type: string
          format: date-time
          description: RFC3339.
        channel:
          type: string
          enum: [app, branch]
    ExperimentAssignment:
      type: object
      additionalProperties: false
      description: Nhánh thí nghiệm, nếu có. Không tham gia chấm điểm.
      required: [participant_id, condition, session_index]
      properties:
        participant_id:
          type: string
        condition:
          type: string
        session_index:
          type: integer
          minimum: 0
    SessionEvent:
      type: object
      additionalProperties: false
      description: Chỉ loại sự kiện và mốc monotonic. Không có nội dung ô nhập.
      required: [type, t]
      properties:
        type:
          type: string
          enum:
            - field_focus
            - field_blur
            - key_tick
            - paste
            - qr_scan
            - saved_payee_pick
            - field_edit
            - screen_enter
            - app_background
            - app_foreground
            - confirm_tap
        t:
          type: number
          minimum: 0
          description: Mốc monotonic, mili giây. Không phải đồng hồ tường.
        field:
          type: string
          description: Tên ô, chỉ với field_focus và field_blur.
        screen:
          type: string
          description: Tên màn, chỉ với screen_enter.
    ExperimentSessionUpload:
      type: object
      additionalProperties: false
      required: [participant_id, condition, session_index, task_type, call, behaviour_features]
      properties:
        participant_id:
          type: string
        condition:
          type: string
        session_index:
          type: integer
          minimum: 0
        task_type:
          $ref: "#/components/schemas/TaskType"
        call:
          $ref: "#/components/schemas/CallContext"
        behaviour_features:
          $ref: "#/components/schemas/BehaviourFeatures"
        raw_events:
          anyOf:
            - type: array
              items:
                $ref: "#/components/schemas/SessionEvent"
            - type: "null"
    ExperimentSessionReceipt:
      type: object
      additionalProperties: false
      required: [stored]
      properties:
        stored:
          const: true
    TxType:
      type: string
      enum:
        - salary_in
        - business_in
        - bill_payment
        - rent
        - card_payment
        - cash_withdrawal
        - transfer
        - own_transfer
        - school_fee
        - large_oneoff
        - own_transfer_drain
        - passthrough_in
        - passthrough_out
        - savings_liquidation
        - quick_loan_disbursement
        - credit_card_cash_advance
        - crypto_purchase
      description: Đúng các giá trị tx_type trong observed/transactions.parquet.
    ChangeType:
      type: string
      enum: [limit_raise, phone_change]
      description: new_device nằm ở event device_change, không nằm ở đây.
    ProductType:
      type: string
      enum:
        - savings
        - securities
        - savings_liquidation
        - quick_loan_disbursement
        - credit_card_cash_advance
      description: >
        savings và securities là account_type trong sim. Ba tên còn lại là tx_type
        của lệnh sản phẩm.
    Event:
      oneOf:
        - $ref: "#/components/schemas/TxnEvent"
        - $ref: "#/components/schemas/AccountChangeEvent"
        - $ref: "#/components/schemas/DeviceChangeEvent"
        - $ref: "#/components/schemas/ProductEvent"
        - $ref: "#/components/schemas/ComplaintEvent"
        - $ref: "#/components/schemas/SimoListingEvent"
      discriminator:
        propertyName: type
        mapping:
          txn: "#/components/schemas/TxnEvent"
          account_change: "#/components/schemas/AccountChangeEvent"
          device_change: "#/components/schemas/DeviceChangeEvent"
          product: "#/components/schemas/ProductEvent"
          complaint: "#/components/schemas/ComplaintEvent"
          simo_listing: "#/components/schemas/SimoListingEvent"
    EventBase:
      type: object
      required: [event_id, type, ts, account_hash]
      properties:
        event_id:
          type: string
        type:
          type: string
        ts:
          type: string
          format: date-time
          description: Dấu đồng hồ demo do bank-core ghi.
        account_hash:
          $ref: "#/components/schemas/Hash"
    TxnEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [tx_type]
          properties:
            type:
              const: txn
            tx_type:
              $ref: "#/components/schemas/TxType"
            counterparty_hash:
              $ref: "#/components/schemas/Hash"
            amount:
              type: integer
              minimum: 0
    AccountChangeEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [change_type]
          properties:
            type:
              const: account_change
            change_type:
              $ref: "#/components/schemas/ChangeType"
            old_value:
              type: string
            new_value:
              type: string
    DeviceChangeEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [change_type]
          properties:
            type:
              const: device_change
            change_type:
              const: new_device
    ProductEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [product_type]
          properties:
            type:
              const: product
            product_type:
              $ref: "#/components/schemas/ProductType"
            amount:
              type: integer
              minimum: 0
    ComplaintEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          properties:
            type:
              const: complaint
            session_ref:
              type: string
              description: Sổ sim chỉ có complaint_id, customer, account, session và complaint_ts. Không có loại khiếu nại.
    SimoListingEvent:
      allOf:
        - $ref: "#/components/schemas/EventBase"
        - type: object
          required: [listed_at, source]
          properties:
            type:
              const: simo_listing
            listed_at:
              type: string
              format: date-time
            source:
              type: string
              description: Nguồn liệt kê trong observed/simo_list.parquet, ví dụ victim, bank, victim_report, police.
    EventReceipt:
      type: object
      required: [event_id, stored]
      properties:
        event_id:
          type: string
        stored:
          type: boolean
    DecideRequest:
      type: object
      required: [decision_id, profile, sender_hash, payee_hash, amount, ts]
      properties:
        decision_id:
          type: string
        profile:
          type: string
          enum: [basic, standard, advanced]
        sender_hash:
          $ref: "#/components/schemas/Hash"
        payee_hash:
          $ref: "#/components/schemas/Hash"
        amount:
          type: integer
          minimum: 0
        ts:
          type: string
          format: date-time
          description: Bank-core điền. App không có trường này.
        task_type:
          $ref: "#/components/schemas/TaskType"
        call:
          $ref: "#/components/schemas/CallContext"
        behaviour_features:
          $ref: "#/components/schemas/BehaviourFeatures"
        transfer_purpose:
          $ref: "#/components/schemas/TransferPurpose"
        device:
          description: >
            Khối v2.1 (in_call, acct_input, ...) cộng state và integrity_verdict_at của v2.4.
            Có thể bỏ cả khối.
          oneOf:
            - allOf:
                - $ref: "#/components/schemas/Device"
                - $ref: "#/components/schemas/DeviceIntegrity"
            - type: "null"
        recent_funds_events:
          type: array
          items:
            $ref: "#/components/schemas/RecentFundsEvent"
        experiment:
          $ref: "#/components/schemas/ExperimentAssignment"
    GroupScores:
      type: object
      additionalProperties: false
      required: [call, entry, payee, mobilization]
      description: Điểm từ 0 đến 1 của bốn nhóm kịch bản. long_term chỉ xuất hiện trong families_hit.
      properties:
        call:
          type: number
          minimum: 0
          maximum: 1
        entry:
          type: number
          minimum: 0
          maximum: 1
        payee:
          type: number
          minimum: 0
          maximum: 1
        mobilization:
          type: number
          minimum: 0
          maximum: 1
    Reason:
      type: object
      required: [code, text]
      properties:
        code:
          type: string
        text:
          type: string
          description: Câu hiện cho khách. simo_listed dùng câu cảnh báo tài khoản đã bị báo cáo.
    EvidenceCard:
      type: object
      additionalProperties: false
      description: Thẻ bằng chứng v2.4. behaviour_score và p_rarity null khi không có behaviour_features.
      required: [signals, reasons_vi, baseline_quality, episode_id]
      properties:
        signals:
          type: array
          items:
            $ref: "#/components/schemas/Signal"
        reasons_vi:
          type: array
          items:
            type: string
        baseline_quality:
          type: string
          enum: [low, medium, high, none]
        episode_id:
          type: string
        behaviour_score:
          type: number
          nullable: true
          description: Điểm thao tác S của phiên. null khi không có behaviour_features.
        p_rarity:
          type: number
          nullable: true
          description: (1 + số điểm tham chiếu >= S) / (n + 1). Ngưỡng 0,05 là demo.
        entry_detail:
          anyOf:
            - $ref: "#/components/schemas/EntryDetail"
            - type: "null"
          description: Cách dán hoặc lấy số từ ảnh. App gắn khi hiện thẻ. Engine không đọc.
    Intervention:
      type: string
      enum: [none, banner, three_button, security_workflow]
      description: Kiểu màn hình v2.4. App dùng trường này cùng engine_level.
    DecideResponse:
      type: object
      description: >
        Giữ các trường v2.1. Thêm level số 0–3, rules_fired, evidence_card và
        intervention. 0 proceed, 1 banner, 2 three-button verification,
        3 security workflow (verified evidence only).
      required:
        - decision_id
        - level
        - rules_fired
        - evidence_card
        - intervention
        - actions
        - p_fraud
        - group_scores
        - families_hit
        - reasons
        - missing_signals
        - profile
        - model_version
        - hold_until
        - countdown_until
      properties:
        decision_id:
          type: string
        level:
          type: integer
          enum: [0, 1, 2, 3]
          description: "0 proceed, 1 banner, 2 three-button verification, 3 security workflow (verified evidence only)."
        rules_fired:
          type: array
          items:
            type: string
          description: Mã luật đã khớp. Ví dụ, chưa phải bộ luật đang chạy.
        evidence_card:
          $ref: "#/components/schemas/EvidenceCard"
        intervention:
          $ref: "#/components/schemas/Intervention"
        actions:
